 if(o.vx!==0){const right=o.vx>0,c=Math.floor((right?o.x+o.w-.01:o.x)/T),r0=Math.floor(o.y/T),r1=Math.floor((o.y+o.h-.01)/T);

   if(step&&wasG&&r===r1&&pen<=(o.h>40?10:8)&&!solidX(L,c,r-1)){o.y=r*T-o.h;continue;}
   o.x=right?c*T-o.w:(c+1)*T;o.hitWall=right?1:-1;o.vx=0;break;}}
 o.y+=o.vy;
 const c0=Math.floor(o.x/T),c1=Math.floor((o.x+o.w-.01)/T),cx=o.x+o.w/2;
 if(o.vy<0){const r=Math.floor(o.y/T);let best=null;
  for(let c=c0;c<=c1;c++){const ch=tile(L,c,r);if((SOL.has(ch)&&ch!=='W')||(ch==='H'&&step)){if(!best||Math.abs(c*T+8-cx)<Math.abs(best.c*T+8-cx))best={c,r};}}
  if(best){o.y=(r+1)*T;o.vy=0;o.ceil=best;}}
 else{const bot=o.y+o.h,r=Math.floor((bot-.01)/T),pb=bot-o.vy;
  for(let c=c0;c<=c1;c++){const ch=tile(L,c,r);if(isSl(tile(L,c,r-1)))continue;
   if((SOL.has(ch)&&ch!=='W')||((ch==='L'||ch==='c')&&pb<=r*T+1)){o.y=r*T-o.h;o.vy=0;o.ground=true;o.gtile=ch;o.gr=r;if(c===Math.floor(cx/T))break;}}}
 if(o.vy>=0){const c=Math.floor(cx/T),bot=o.y+o.h,rb=Math.floor(bot/T);
  for(let r=rb-1;r<=rb+1;r++){const ch=tile(L,c,r);if(!isSl(ch))continue;const lx=cx-c*T,s=ch==='/'?r*T+16-lx:r*T+lx;
   if(bot>=s-(wasG?8:0)&&bot<=s+12){o.y=s-o.h;o.vy=0;o.ground=true;o.slope=ch==='/'?-1:1;o.gtile=ch;break;}}}}

   case'panda':e.vx=e.dir*.55;grav(e);moveBody(e,L);if(e.hitWall)e.dir*=-1;if(L.edge)edgeTurn(e,L);break;
   case'snapper':
    if(e.st==='walk')e.vx=e.dir*.5;else if(e.st==='shell'){e.vx*=.8;if(e.tm>480){e.st='walk';e.y-=6;e.h=14;e.dir=P.x<e.x?-1:1;}}else if(e.st==='kick')e.vx=e.dir*3.6;
    if(e.st!=='carry'){grav(e);moveBody(e,L);if(L.edge&&e.st==='walk')edgeTurn(e,L);if(e.hitWall){e.dir*=-1;if(e.st==='kick'){const c=Math.floor((e.hitWall>0?e.x+e.w+1:e.x-1)/T),r=Math.floor((e.y+e.h/2)/T);const ch=tile(L,c,r);if(ch==='?'||ch==='R'||ch==='H')bump(c,r);else sfx('bump');}}}

    grav(e);moveBody(e,L);if(e.hitWall)e.dir*=-1;if(L.edge)edgeTurn(e,L);break;}
   case'salmon':{const wy=(L.water||16)*T;

// --- game over ---
function overUpdate(){if(sT>60&&(PR.J||PR.S)){G.lives=5;G.score=0;G.cones=0;G.form='small';G.cards=[];saveG();goScene('map');}}
function overRender(){const g=X;g.fillStyle='#07100b';g.fillRect(0,0,W,H);g.save();g.filter='brightness(.35) saturate(.6)';coverG(g,A.bg_far,1.05);g.restore();
 txtC(g,'GAME OVER',W/2,64,'#f2a93b',3.2,'#3a1a08');txtC(g,'THE HIKERS GOT THEIR PHOTO...',W/2,108,'#e6dcc4',1,'#07100b');if((frame>>5)%2)txtC(g,'PRESS Z TO TRY AGAIN',W/2,140,'#9fc77a',1.2,'#07100b');txtC(g,'MAP PROGRESS IS KEPT',W/2,160,'#8a9a7a');}
// --- ending ---
function endingUpdate(){if(sT>240&&(PR.J||PR.S)){sfx('coin');goScene('map');}}
function endingRender(){const g=X;g.fillStyle='#07100b';g.fillRect(0,0,W,H);g.save();g.globalAlpha=Math.min(1,sT/90);coverG(g,A.ending,1.08-.06*Math.min(1,sT/900),.5,.4);g.restore();
 const v=g.createLinearGradient(0,0,0,H);v.addColorStop(0,'rgba(7,16,11,.55)');v.addColorStop(.3,'rgba(7,16,11,0)');v.addColorStop(.62,'rgba(7,16,11,0)');v.addColorStop(1,'rgba(7,16,11,.9)');g.fillStyle=v;g.fillRect(0,0,W,H);
 if(sT>50)txtC(g,'WORLD 1 CLEAR!',W/2,10,'#ffd77a',2.6,'#3a1a08');
 const L=['THE LUMBER BARON IS BEATEN','BIGFOOT VALLEY IS SAFE... FOR NOW','SCORE '+String(G.score).padStart(7,'0')];
 L.forEach((l,i)=>{if(sT>110+i*40)txtC(g,l,W/2,152+i*12,i===2?'#ffd77a':'#f2ead6',1,'#07100b');});
 if(sT>240){txtC(g,'HOWARDAI - I WANT THAT',W/2,192,'#c9b6ff',1,'#07100b');if((frame>>5)%2)txtC(g,'PRESS Z',W/2,204,'#9fc77a',.9,'#07100b');}}
// --- titan splash (device space) ---
function splashRender(){if(SPLASH<=0||!ok(IMG.titan))return;const t=100-SPLASH,a=t<14?t/14:SPLASH<18?SPLASH/18:1;
 D.save();D.setTransform(1,0,0,1,0,0);D.globalAlpha=a*.95;D.imageSmoothingEnabled=true;D.imageSmoothingQuality='high';cover(IMG.titan,1.12-.1*t/100,.5,.4);
 D.globalAlpha=a;const k=u();D.fillStyle='rgba(11,20,15,.75)';D.fillRect(0,cv.height-52*k,cv.width,52*k);
 const sh=Math.sin(t*.9)*(t<30?2:0);TXTLW=.6;txtDC('TIMBER TITAN!',W/2+sh,H-46,'#d8ff6a',3.6,'#132010');TXTLW=1;
 txtDC('SMASH ROCKS - X ROAR - DOWN IN AIR GROUND POUND',W/2,H-12,'#f2ead6',1,'#07100b');D.restore();}
// ================= MAIN LOOP =================
function step(){pollInput();if(!READY())return;frame++;sT++;
 if(PR.M){muted=!muted;if(MG)MG.gain.value=muted?0:.32;}
 switch(scene){case'title':titleUpdate();break;case'map':mapUpdate();break;case'level':levelUpdate();break;case'hut':hutUpdate();break;case'over':overUpdate();break;case'ending':endingUpdate();break;}}
function render(){musicTick();const k=u();D.setTransform(1,0,0,1,0,0);D.filter='none';D.globalAlpha=1;D.imageSmoothingEnabled=true;D.imageSmoothingQuality='high';
 if(!READY()){D.fillStyle='#07100b';D.fillRect(0,0,cv.width,cv.height);D.setTransform(k,0,0,k,0,0);txtC(D,'GATHERING THE FOREST...',W/2,92,'#9fc77a',1.2);
  D.fillStyle='#2a3a2e';D.beginPath();D.roundRect(W/2-80,112,160,6,3);D.fill();D.fillStyle='#f2a93b';D.beginPath();D.roundRect(W/2-80,112,Math.max(6,160*LOADN/HDN.length),6,3);D.fill();return;}
 if(scene==='title'){titleRender();return;}
 D.setTransform(k,0,0,k,0,0);
 if(scene==='map')mapRender();else if(scene==='level')drawLevel();else if(scene==='hut')hutRender();else if(scene==='over')overRender();else if(scene==='ending')endingRender();
 if(scene==='level'&&sT<100&&!P.dead){const g=X;pBox(g,W/2-78,58,156,44,6);txtC(g,LDEF[CUR].card||('WORLD '+CUR),W/2,64,'#f2a93b',2,'#1a1208');txtC(g,LDEF[CUR].name,W/2,87,'#9fc77a');}
 if(scene==='level')splashRender();
 D.setTransform(1,0,0,1,0,0);
 if(muted){txtD('MUTED',W-40,2,'#8a9a7a',1,'#07100b');}}
let last=performance.now(),acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){acc-=1000/60;step();}render();requestAnimationFrame(loop);}
goScene('title');requestAnimationFrame(loop);
</script></body></html>
