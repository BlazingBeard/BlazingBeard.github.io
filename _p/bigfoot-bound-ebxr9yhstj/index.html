<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">

<style>
html,body{margin:0;height:100%;background:#07100b;overflow:hidden}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
#touch{position:fixed;inset:0;pointer-events:none;display:none;font-family:system-ui,sans-serif}
body.tm{touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#touch .b{position:absolute;pointer-events:auto;box-sizing:border-box;background:#0b140fb0;border:2px solid #9fc77aa0;color:#f2a93b;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;touch-action:none;transition:background .05s,transform .05s}
#touch .b.on{background:#9fc77add;color:#0b140f;transform:scale(.94)}
#pad{position:absolute;left:8px;bottom:22px;width:132px;height:132px}
#pad .b{width:44px;height:44px;border-radius:9px;font-size:16px}
#pad .hub{position:absolute;left:44px;top:44px;width:44px;height:44px;background:#0b140fb0;border-top:2px solid #9fc77a40;border-bottom:2px solid #9fc77a40;box-sizing:border-box}
#ab{position:absolute;right:8px;bottom:22px;width:136px;height:120px}
#ab .b{width:64px;height:64px;border-radius:50%}
#st{right:10px;top:10px;width:70px;height:32px;border-radius:9px;font-size:12px!important;letter-spacing:1px}
#rot{position:absolute;left:0;right:0;text-align:center;color:#9fc77a;font-size:13px;opacity:.8;display:none}
@media (orientation:portrait){#rot{display:block}#pad{left:18px;bottom:40px;transform:scale(1.15);transform-origin:left bottom}#ab{right:18px;bottom:40px;transform:scale(1.15);transform-origin:right bottom}}
</style></head><body>
<canvas id="c"></canvas>
<div id="touch">
 <div id="pad"><div class="b" data-k="U" style="left:44px;top:0">&#9650;</div><div class="b" data-k="L" style="left:0;top:44px">&#9664;</div><div class="hub"></div><div class="b" data-k="R" style="left:88px;top:44px">&#9654;</div><div class="b" data-k="D" style="left:44px;top:88px">&#9660;</div></div>
 <div id="ab"><div class="b" data-k="B" style="left:0;top:52px">B</div><div class="b" data-k="J" style="left:72px;top:6px">A</div></div>
 <div class="b" id="st" data-k="S">START</div>
