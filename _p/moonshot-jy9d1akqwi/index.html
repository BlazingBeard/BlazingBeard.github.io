  let body = '';
  if (s.t === 'prop') {
    const rows = [['Owned · base rent', s.rent[0]], ['Moonshot unlocked (all owned)', s.rent[0] * 2], ...LEVELS.slice(1).map((l, k) => [l, s.rent[k + 1]])];
    const nowRow = o ? (o.lvl > 0 ? o.lvl + 1 : hasMono(o.o, s.g) ? 1 : 0) : -1;
    body += `<table class="rent">${rows.map((r, k) => `<tr class="${k === nowRow ? 'now' : ''}"><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`).join('')}</table>
      <div class="kv"><b>Stage cost</b><span>${fmt(houseCost(s.g))} per MVP stage</span><b>Pause value</b><span>${fmt(s.price / 2)}</span></div>`;
  } else if (s.t === 'rail') body += `<table class="rent">${[1, 2, 3, 4].map(n => `<tr><td>${n} execution rail${n > 1 ? 's' : ''} owned</td><td>${fmt(K(25) * 2 ** (n - 1))}</td></tr>`).join('')}</table>`;
  else if (s.t === 'util') body += `<table class="rent"><tr><td>One utility owned</td><td>${fmt(K(4))} × dice</td></tr><tr><td>Both utilities owned</td><td>${fmt(K(10))} × dice</td></tr></table>`;
  else if (s.t === 'jail') body += '<p>Repeated pilots, little reuse. Roll doubles, pay the fine or play a “Retire the old path” card to scale out.</p>';
  else if (s.t === 'gotojail') body += '<p>“Do not automate ambiguity.” Land here and go straight to Poetry Jail.</p>';
  else if (s.t === 'parking') body += `<p>Every tax, fine and fee lands in the Copilot Cup pot. Land here to collect it all. Current pot: <b>${st ? fmt(st.pot) : '€0'}</b>.</p>`;
  else if (s.t === 'go') body += `<p>Pass to collect the ${fmt(GO_PAY)} learning dividend — each lap compounds.</p>`;
  else if (s.t === 'tax') body += `<p>Pay ${fmt(s.amt)} into the Copilot Cup pot.</p>`;
  else body += `<p>Draw a ${s.name} card.</p>`;
  if (G) body += `<div class="kv"><b>Moonshot intent</b><span>${esc(G.intent)}</span><b>Our edge</b><span>${esc(G.edge)}</span><b>Cockpit</b><span>${esc(G.cockpit)}</span></div>`;
  if (o && st) {
    const p = st.players[o.o];
    body += `<div class="kv"><b>Owner</b><span>${p.emoji} ${esc(p.name)}${o.m ? ' · paused' : ''}</span>${s.t === 'prop' ? `<b>Stage</b><span>${LEVELS[o.lvl]}</span>` : ''}<b>Board thesis</b><span>${REASONS[s.best].ico} ${REASONS[s.best].label}</span><b>Rent now</b><span>${fmt(rentFor(i))}${s.t === 'util' ? ' (at last roll)' : ''}</span></div>`;
    const h = human();
    if (h && h.id === o.o && st.phase !== 'busy') body += `<div class="acts">${actionBtns(i)}</div>`;
  }
  openModal('deed', `<div class="mbox"><div class="mhead" style="background:${col}"><button class="x" data-act="closeModal">✕</button><small>${G ? esc(G.name) : s.t === 'rail' ? 'Execution plane' : s.t === 'util' ? 'Shared platform' : 'FundsPlace'}</small><h2>${s.ico || ''} ${esc(s.name)}</h2>${s.price ? `<div style="font:700 18px Consolas,monospace">${fmt(s.price)}</div>` : ''}</div>
    <div class="mbody">${s.blurb ? `<p style="margin-top:0">${esc(s.blurb)}</p>` : ''}${body}</div></div>`);
}
function actionBtns(i) {
  const p = human(), s = SP[i], o = st.own[i]; let b = '';
  if (s.t === 'prop' && canBuild(p.id, i)) b += `<button class="btn" data-act="pbuild" data-arg="${i}" ${p.cash < houseCost(s.g) ? 'disabled' : ''}>🏗️ ${LEVEL_SHORT[o.lvl + 1]} −${fmt(houseCost(s.g))}</button>`;
  if (canSell(p.id, i)) b += `<button class="btn" data-act="psell" data-arg="${i}">↩️ Sell +${fmt(houseCost(s.g) / 2)}</button>`;
  if (canMortgage(p.id, i)) b += `<button class="btn" data-act="pmort" data-arg="${i}">⏸️ Pause +${fmt(s.price / 2)}</button>`;
  if (o.m) b += `<button class="btn" data-act="punmort" data-arg="${i}">▶️ Resume −${fmt(unmortCost(i))}</button>`;
  return b;
}
function showPortfolio() {
  const p = human() || st.players.find(q => isLocal(q) && !q.out);
  if (!p) return;
  const mine = owned(p.id).sort((a, b) => a - b), canAct = human() === p && st.phase !== 'busy';
  const rows = mine.map(i => {
    const s = SP[i], o = st.own[i], col = s.g ? GROUPS[s.g].color : '#5b6475';
    return `<div class="prow"><div class="sw" style="background:${col}"></div><div class="pn"><b data-act="deed" data-arg="${i}" style="cursor:pointer">${s.ico || ''} ${esc(s.name)}</b><small>${s.t === 'prop' ? LEVELS[o.lvl] : s.t === 'rail' ? 'Execution rail' : 'Platform utility'}${o.m ? ' · ⏸️ paused' : ''} · rent ${fmt(rentFor(i))}</small></div>${canAct ? actionBtns(i) : ''}</div>`;
  }).join('');
  openModal('portfolio', `<div class="mbox"><div class="mhead" style="background:linear-gradient(135deg,${p.color},#232833)"><button class="x" data-act="closeModal">✕</button><small>Treasury · ${p.emoji} ${esc(p.name)}</small><h2>${fmt(p.cash)} cash · ${fmt(netWorth(p))} net worth</h2></div>
    <div class="mbody">${st.phase === 'debt' && human() === p ? `<p style="color:#ff9e80">You owe ${fmt(-p.cash)}. Sell MVP stages or pause investments until cash is positive.</p>` : ''}
    <p style="color:var(--muted);font-size:12.5px;margin-top:0">Own every capability in a moonshot to unlock it, then build MVP stages evenly: Assist → Recommend → Orchestrate → Scale → Cockpit live.</p>
    ${rows || '<p style="color:var(--muted)">No positions yet.</p>'}</div></div>`);
}
function showTrade() {
  const p = human(); if (!p) return UI.toast('Wait for your turn to negotiate');
  if (st.phase === 'busy' || st.phase === 'debt') return;
  const opts = Object.keys(st.own).map(Number).filter(i => { const o = st.own[i]; return o.o !== p.id && !st.players[o.o].out && !(SP[i].g && groupHasBuildings(SP[i].g)); })
    .sort((a, b) => a - b).map(i => { const s = SP[i], o = st.players[st.own[i].o]; return `<option value="${i}">${o.emoji} ${esc(o.name)} — ${esc(s.name)} (${fmt(s.price)})${s.g && GIDX[s.g].filter(j => j !== i).every(j => st.own[j] && st.own[j].o === p.id) ? ' ★ completes your moonshot' : ''}</option>`; }).join('');
  openModal('trade', `<div class="mbox"><div class="mhead" style="background:linear-gradient(135deg,#7b6cf6,#2f3f9e)"><button class="x" data-act="closeModal">✕</button><small>Negotiation desk</small><h2>Make an offer</h2></div>
    <div class="mbody">${opts ? `<label style="font-size:12px;color:var(--muted)">Opportunity</label><select id="trProp" style="width:100%;margin:4px 0 12px">${opts}</select>
      <label style="font-size:12px;color:var(--muted)">Your cash offer (€k) — you have ${fmt(p.cash)}</label><input id="trAmt" type="number" min="10" step="50" value="1000" style="width:100%;margin-top:4px">
      <div id="trMsg" style="margin-top:12px;font-size:13px"></div><div class="acts"><button class="btn pri" data-act="tradeSend">Send offer</button></div>
      <p style="color:var(--muted);font-size:12px">AI executives price in strategic value: completing your moonshot costs more.</p>` : '<p>No tradable opportunities owned by other executives yet (moonshots with MVP stages can’t be traded).</p>'}</div></div>`);
}
function showRules() {
  openModal('rules', `<div class="mbox"><div class="mhead" style="background:linear-gradient(135deg,#0f9a7f,#2f3f9e)"><button class="x" data-act="closeModal">✕</button><small>How to play</small><h2>Build the intelligent marketplace</h2></div>
    <div class="mbody rules"><ul>
      <li>Each executive starts with <b>${fmt(START)}</b> of virtual investment capital. Highest net worth at market close wins — or be the last executive standing.</li>
      <li>Land on an unfunded capability to invest. Every ticket needs a reason: <i>“I would invest because…”</i>. Match the board’s thesis for a <b>${fmt(K(15))} conviction bonus</b>.</li>
      <li>Colour groups are the <b>five moonshots</b> plus the Trusted Foundation, Agentic Control Plane and Gold Release. Own a whole group to <b>unlock the moonshot</b> (rent doubles).</li>
      <li>Then build MVP stages evenly: <b>Assist → Recommend → Orchestrate → Scale → Cockpit live</b>. Your city skyline literally grows.</li>
      <li><b>All bets compound:</b> each extra unlocked moonshot adds +10% network rent across your portfolio.</li>
      <li>🔗 Execution rails (Sirion, CIAM, Linx, FundSettle) and 🧠🔌 platform utilities reward reuse.</li>
      <li>🌀 <b>Automated Ambiguity</b> or three doubles sends you to 📜 <b>Poetry Jail</b>. Taxes and fines fill the 🏆 Copilot Cup pot.</li>
      <li>📡 Market Signals and 🗳️ Executive Decisions come straight from the briefing — including the six executive decisions.</li>
      <li>Short on cash? <b>Pause</b> (mortgage) investments or roll back MVP stages. Use 🤝 Negotiate to buy from rivals.</li>
    </ul></div></div>`);
}
function showSetup() {
  const saved = loadSave();
  const rows = (UI.setup = UI.setup || DEFAULT_PLAYERS.map(p => ({ ...p })));
  openModal('setup', `<div class="mbox" style="width:min(620px,94vw)"><div class="mhead" style="background:linear-gradient(135deg,#0f9a7f,#2f3f9e 60%,#7b6cf6)">${st ? '<button class="x" data-act="closeModal">✕</button>' : ''}<small>Executive Opportunity Market</small><h2>FundsPlace · Moonshot Monopoly</h2><div style="font-size:13px;opacity:.9">Five moonshots. ${fmt(START)} each. Turn the marketplace into a compounding intelligence business.</div></div>
    <div class="mbody">
      <div class="h"><span>Executives (2–4)</span><span>tap the token to change it</span></div>
      ${rows.map((p, k) => `<div class="setrow"><input type="checkbox" data-act="sOn" data-arg="${k}" ${p.on ? 'checked' : ''} ${k < 2 ? 'disabled' : ''}>
        <button class="emo" style="--pc:${PCOLORS[k]}" data-act="sEmo" data-arg="${k}">${p.emoji}</button>
        <input type="text" id="sName${k}" value="${esc(p.name)}" maxlength="24">
        <select id="sBot${k}"><option value="0" ${!p.bot && !p.remote ? 'selected' : ''}>Human (this screen)</option><option value="2" ${p.remote ? 'selected' : ''}>🌐 Remote player</option><option value="1" ${p.bot ? 'selected' : ''}>AI executive</option></select></div>`).join('')}
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px">🌐 Remote players join from their own device over an encrypted peer-to-peer link — you’ll get a QR code and link for each seat.</div>
      <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
        <label style="font-size:12px;color:var(--muted)">Market close<br><select id="sMin"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option><option value="0">No limit</option></select></label>
        <label style="font-size:12px;color:var(--muted)">AI pace<br><select id="sSpeed"><option value="normal">Normal</option><option value="fast">Fast</option></select></label>
      </div>
      <div class="acts"><button class="btn pri" data-act="startgame">🚀 Open the market</button>${saved ? `<button class="btn" data-act="resume">↻ Resume saved game (round ${saved.round})</button>` : ''}<button class="btn" data-act="rules">❔ Rules</button></div>
      <div class="foot">Content adapted from the FundsPlace Executive Briefing · Built with HowardAI</div>
    </div></div>`, !st);
}
function readSetup() {
  UI.setup.forEach((p, k) => { p.name = $('#sName' + k).value.trim() || `Executive ${k + 1}`; p.bot = $('#sBot' + k).value === '1'; p.remote = $('#sBot' + k).value === '2'; });
}

// ---------- timer ----------
setInterval(() => {
  if (!st) return;
  const t = $('#timer');
  if (!st.endAt) { t.textContent = '∞'; return; }
  const rem = st.over ? 0 : Math.max(0, st.endAt - Date.now());
  t.textContent = `${String(Math.floor(rem / 60000)).padStart(2, '0')}:${String(Math.floor(rem / 1000) % 60).padStart(2, '0')}`;
  t.classList.toggle('warn', rem < 120000);
  if (!rem && !st.timeUp && !st.over && NETX.role !== 'client') { st.timeUp = true; UI.toast('🔔 Market close — this is the final turn'); log('🔔 Market close reached — final turn'); }
}, 500);

// ---------- events ----------
const UACT = {
  view(v) { view = v; localStorage.setItem('fp-view', v); applyView(); },
  zoom(z) { zoom = z === 'reset' ? 1 : Math.min(2, Math.max(0.5, zoom * +z)); applyView(); },
  sound() { muted = !muted; localStorage.setItem('fp-muted', muted ? '1' : '0'); $('#soundBtn').textContent = muted ? '🔇' : '🔊'; },
  rules: showRules, setup: showSetup,
  deed(i) { showDeed(i); }, portfolio: showPortfolio, trade: showTrade,
  closeModal() { if (R.card || R.offer) return; UI.closeModal(); },
  invite() { NET.showInvite(); },
  takeover(k) { NET.takeover(+k); },
  copyLink(k) { NET.copyLink(+k); },
  pubUrl() { NET.setPubUrl(); },
  cardOk() { R.card && R.card(); },
  offerAns(v) { R.offer && R.offer(v === '1'); },
  sOn(k) { readSetup(); UI.setup[k].on = !UI.setup[k].on; showSetup(); },
  sEmo(k) { readSetup(); const p = UI.setup[k]; p.emoji = EMOJIS[(EMOJIS.indexOf(p.emoji) + 1) % EMOJIS.length]; showSetup(); },
  startgame() {
    readSetup();
    const cfg = { players: UI.setup.filter(p => p.on), minutes: +$('#sMin').value, speed: $('#sSpeed').value };
    if (st) { sessionStorage.setItem('fp-newcfg', JSON.stringify(cfg)); localStorage.removeItem('fp-save'); location.reload(); return; }
    launch(cfg);
  },
  resume() {
    if (st) { sessionStorage.setItem('fp-resume', '1'); location.reload(); return; }
    const s = loadSave(); if (!s) return; UI.closeModal(); resumeGame(s); boot(); log('↻ Game resumed'); NET.maybeHost(false); startTurn();
  }
};
// Remote clients forward game actions to the host instead of running the engine (fp-net.js sets NET.send).
function dispatch(a, arg) {
  if (NETX.role === 'client' && typeof NET !== 'undefined' && NET.clientAct(a, arg)) return;
  if (UACT[a]) UACT[a](arg); else if (ACT[a]) ACT[a](arg);
}
document.addEventListener('click', e => {
  if (e.target.id === 'modal' && !$('#modal').dataset.lock) return UI.closeModal();
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, arg = b.dataset.arg;
  if (b.type === 'checkbox') e.preventDefault();
  dispatch(a, arg);
});
document.addEventListener('keydown', e => {
  if (!st || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (R.card && $('#modal').classList.contains('on') && UI.modalKind === 'card' && ($('#mcontent [data-act=cardOk]') || (cur().bot && NETX.role !== 'client'))) { e.preventDefault(); return dispatch('cardOk'); }
    if ($('#modal').classList.contains('on')) return;
    if (human() && st.phase === 'roll') { e.preventDefault(); dispatch('roll'); } else if (human() && st.phase === 'end') { e.preventDefault(); dispatch('end'); }
  }
  if (e.key === 'Escape') UACT.closeModal();
});
addEventListener('resize', () => applyView());

function boot() {
  buildBoard(); $('#tokens').innerHTML = ''; UI.tokens(); UI.render();
  $('#soundBtn').textContent = muted ? '🔇' : '🔊';
  UI.rollDice(st.dice);
}
function launch(cfg) {
  UI.closeModal(); newGame(cfg); boot();
  log(`🚀 Market open: ${st.players.map(p => p.emoji + ' ' + p.name).join(', ')} each receive ${fmt(START)}`);
  UI.render(); NET.maybeHost(true); startTurn();
}
(function init() {
  NET.install();
  if (NET.joinFromHash()) return;
  buildBoard();
  const cfg = sessionStorage.getItem('fp-newcfg');
  if (cfg) { sessionStorage.removeItem('fp-newcfg'); return launch(JSON.parse(cfg)); }
  if (sessionStorage.getItem('fp-resume')) { sessionStorage.removeItem('fp-resume'); const s = loadSave(); if (s) { resumeGame(s); boot(); NET.maybeHost(false); startTurn(); return; } }
  showSetup();
})();

</script>
</body>
</html>
