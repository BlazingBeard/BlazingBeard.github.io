  const ranks = st.players.slice().sort((a, b) => netWorth(b) - netWorth(a)).map(q => q.id);
  $('#players').innerHTML = st.players.map(p => {
    const nw = p.out ? 0 : netWorth(p), dep = nw ? Math.round((nw - p.cash) / nw * 100) : 0;
    return `<div class="pl ${p.out ? 'out' : ''} ${p.id === st.turn ? 'cur' : ''}"><div class="av" style="--pc:${p.color}">${p.emoji}</div>
      <div><div class="nm">#${ranks.indexOf(p.id) + 1} ${esc(p.name)} ${p.bot ? '<span class="botchip">AI</span>' : ''}${p.remote ? `<span class="botchip" title="${st.netLive && st.netLive[p.id] ? 'connected' : 'not connected'}">${st.netLive && st.netLive[p.id] ? '🟢' : '⚪'} REMOTE</span>` : ''}${NETX.role === 'client' && p.id === NETX.seat ? ' <span class="botchip" style="background:var(--teal);color:#04110e">YOU</span>' : ''} ${p.jail ? '🧪' : ''}</div>
      <div class="meta">${p.out ? 'Headed south' : `Cash ${fmt(p.cash)} · ${owned(p.id).length} cards · 🧭 ${p.aligned || 0}/${p.picks || 0} facts`}</div>
      <div class="badges">${completeGroups(p.id).map(g => `<u style="background:${GROUPS[g].color}" title="${esc(GROUPS[g].name)}"></u>`).join('')} ${p.ach.filter(a => !a.key.startsWith('ms-')).map(a => `<span title="${esc(a.title)}" style="font-size:12px">${a.ico}</span>`).join('')}</div></div>
      <div class="worth">${fmt(nw)}<small>net worth</small></div>
      <div class="bar"><i style="--pc:${p.color};width:${nw / max * 100}%"></i></div></div>`;
  }).join('');
}
function renderChart() {
  const W = 360, H = 150, pl = 34, pr = 8, pt = 10, pb = 22;
  const len = Math.max(...st.players.map(p => p.hist.length));
  const all = st.players.flatMap(p => p.hist).concat([START * 1.3]);
  const max = Math.max(...all), min = Math.min(0, ...all);
  const X = k => pl + (len > 1 ? k / (len - 1) : 0) * (W - pl - pr);
  const Y = v => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%">`;
  const zones = [['Cheechako', 0], ['Sourdough', 0.33], ['Old Timer', 0.66]];
  zones.forEach(([t, f], k) => { s += `<rect x="${pl + f * (W - pl - pr)}" y="${pt}" width="${(W - pl - pr) / 3}" height="${H - pt - pb}" fill="${['#1a2a38', '#1c3036', '#1d3a2c'][k]}" opacity=".6"/><text x="${pl + f * (W - pl - pr) + 4}" y="${H - 8}" font-size="9" fill="#8c95a6">${t}</text>`; });
  s += `<line x1="${pl}" x2="${W - pr}" y1="${Y(START)}" y2="${Y(START)}" stroke="#6b7385" stroke-dasharray="4 3"/><text x="2" y="${Y(START) + 3}" font-size="9" fill="#8c95a6">${fmt(START)}</text>`;
  s += `<text x="2" y="${pt + 8}" font-size="9" fill="#8c95a6">${fmt(max)}</text>`;
  st.players.forEach(p => {
    if (p.hist.length < 1) return;
    const pts = p.hist.map((v, k) => `${X(k)},${Y(v)}`).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="${p.color}" stroke-width="${p.bot ? 1.6 : 2.6}" stroke-linejoin="round" opacity="${p.out ? 0.35 : 1}"/>`;
    const last = p.hist.length - 1; s += `<text x="${X(last) - 6}" y="${Y(p.hist[last]) - 4}" font-size="11">${p.emoji}</text>`;
  });
  s += '</svg><div style="font-size:11.5px;color:var(--muted)">Complete sets, upgrade to Mythic, and watch your collection’s value climb.</div>';
  $('#chart').innerHTML = s;
}
function renderReasons() {
  const tot = st.reasons.right + st.reasons.wrong;
  $('#reasons').innerHTML = `<div class="rg">✅ Answered right<small>${st.reasons.right} card${st.reasons.right === 1 ? '' : 's'}</small></div><div class="rg">📘 Learned the hard way<small>${st.reasons.wrong} card${st.reasons.wrong === 1 ? '' : 's'}</small></div>`
    + st.players.map(p => `<div class="rg">${p.emoji} ${esc(p.name)}<small>${p.aligned || 0}/${p.picks || 0} right${(p.aligned || 0) >= 8 ? ' · Old Timer' : (p.aligned || 0) >= 3 ? ' · Sourdough' : ' · Cheechako'}</small></div>`).join('')
    + `<div class="rg">🧠 Table score<small>${tot ? Math.round(st.reasons.right / tot * 100) : 0}% of ${tot}</small></div>`;
}
function renderTheses() {
  $('#theses').innerHTML = st.theses.length ? st.theses.slice(0, 8).map(t => {
    const p = st.players[t.pid], s = SP[t.i];
    return `<div class="thesis">${p.emoji} <b>${esc(p.name)}</b> → <b style="color:${s.g ? GROUPS[s.g].color : '#9aa3b2'}">${esc(s.name)}</b>${t.aligned ? ' <span class="ok">✓ knew it</span>' : ' <span style="color:#7fb8ff">📘 learned</span>'}<br><q>${esc(s.f.length > 170 ? s.f.slice(0, s.f.lastIndexOf(' ', 165)) + '…' : s.f)}</q></div>`;
  }).join('') : '<div style="color:var(--muted);font-size:12.5px">No cards claimed yet. Every card teaches an Alaska fact.</div>';
}
function renderLog() { $('#log').innerHTML = st.log.slice(0, 60).map(l => `<div>${esc(l)}</div>`).join(''); }

// ---------- modals ----------
function openModal(kind, html, noBackdropClose) {
  UI.modalKind = kind; $('#mcontent').innerHTML = html; const m = $('#modal'); m.classList.add('on'); m.dataset.lock = noBackdropClose ? '1' : '';
}
function showDeed(i) {
  i = +i; UI.deedIdx = i;
  const s = SP[i], o = st && st.own[i], col = s.g ? GROUPS[s.g].color : '#4b5876', G = s.g && GROUPS[s.g];
  let body = '';
  if (s.t === 'prop') {
    const rows = [['Common · base rent', s.rent[0]], ['Full set (all owned)', s.rent[0] * 2], ...LEVELS.slice(1).map((l, k) => [l, s.rent[k + 1]])];
    const nowRow = o ? (o.lvl > 0 ? o.lvl + 1 : hasMono(o.o, s.g) ? 1 : 0) : -1;
    body += `<table class="rent">${rows.map((r, k) => `<tr class="${k === nowRow ? 'now' : ''}"><td>${r[0]}</td><td>${fmt(r[1])}</td></tr>`).join('')}</table>
      <div class="kv"><b>Upgrade cost</b><span>${fmt(houseCost(s.g))} per foil level</span><b>Mortgage value</b><span>${fmt(s.price / 2)}</span></div>`;
  } else if (s.t === 'rail') body += `<table class="rent">${[1, 2, 3, 4].map(n => `<tr><td>${n} route${n > 1 ? 's' : ''} owned</td><td>${fmt(K(25) * 2 ** (n - 1))}</td></tr>`).join('')}</table>`;
  else if (s.t === 'util') body += `<table class="rent"><tr><td>One power source</td><td>${fmt(K(4))} × dice</td></tr><tr><td>Both power sources</td><td>${fmt(K(10))} × dice</td></tr></table>`;
  else if (s.t === 'jail') body += '<p>Fog, wind and rain have shut down the floatplanes. Roll doubles, pay the fine or use a “favor” card to get out.</p>';
  else if (s.t === 'gotojail') body += '<p>Small craft advisory! Land here and go straight to Weathered In.</p>';
  else if (s.t === 'parking') body += `<p>Every fee and fine goes into the Salmon Bake pot. Land here and you eat it all. Current pot: <b>${st ? fmt(st.pot) : '$0'}</b>.</p>`;
  else if (s.t === 'go') body += `<p>Pass to collect the ${fmt(GO_PAY)} PFD check. Alaska’s Permanent Fund Dividend, paid from oil wealth.</p>`;
  else if (s.t === 'tax') body += `<p>Pay ${fmt(s.amt)} into the Salmon Bake pot.</p>`;
  else body += `<p>Draw a ${s.name} card.</p>`;
  if (G) body += `<div class="kv"><b>Field note</b><span>${esc(G.intent)}</span><b>Where</b><span>${esc(G.edge)}</span><b>Mythic title</b><span>${esc(G.cockpit)}</span></div>`;
  if (s.f && o) body += `<div class="lesson ok" style="margin-top:10px"><b>🏔️ Alaska fact</b>${esc(s.f)}</div>`;
  if (o && st) {
    const p = st.players[o.o];
    body += `<div class="kv"><b>Owner</b><span>${p.emoji} ${esc(p.name)}${o.m ? ' · mortgaged' : ''}</span>${s.t === 'prop' ? `<b>Foil</b><span>${LEVELS[o.lvl]}</span>` : ''}<b>Rent now</b><span>${fmt(rentFor(i))}${s.t === 'util' ? ' (at last roll)' : ''}</span></div>`;
    const h = human();
    if (h && h.id === o.o && st.phase !== 'busy') body += `<div class="acts">${actionBtns(i)}</div>`;
  }
  openModal('deed', `<div class="mbox"><div class="mhead" style="background:${col}"><button class="x" data-act="closeModal">✕</button><small>${G ? esc(G.name) : s.t === 'rail' ? 'Transport route' : s.t === 'util' ? 'Power source' : 'Ketchikan'}</small><h2>${s.ico || ''} ${esc(s.name)}</h2>${s.price ? `<div style="font:700 18px Consolas,monospace">${fmt(s.price)}</div>` : ''}</div>
    <div class="mbody">${s.blurb ? `<p style="margin-top:0">${esc(s.blurb)}</p>` : ''}${body}</div></div>`);
}
function actionBtns(i) {
  const p = human(), s = SP[i], o = st.own[i]; let b = '';
  if (s.t === 'prop' && canBuild(p.id, i)) b += `<button class="btn" data-act="pbuild" data-arg="${i}" ${p.cash < houseCost(s.g) ? 'disabled' : ''}>🏗️ ${LEVEL_SHORT[o.lvl + 1]} −${fmt(houseCost(s.g))}</button>`;
  if (canSell(p.id, i)) b += `<button class="btn" data-act="psell" data-arg="${i}">↩️ Sell +${fmt(houseCost(s.g) / 2)}</button>`;
  if (canMortgage(p.id, i)) b += `<button class="btn" data-act="pmort" data-arg="${i}">⏸️ Mortgage +${fmt(s.price / 2)}</button>`;
  if (o.m) b += `<button class="btn" data-act="punmort" data-arg="${i}">▶️ Resume −${fmt(unmortCost(i))}</button>`;
  return b;
}
function showPortfolio() {
  const p = human() || st.players.find(q => isLocal(q) && !q.out);
  if (!p) return;
  const mine = owned(p.id).sort((a, b) => a - b), canAct = human() === p && st.phase !== 'busy';
  const rows = mine.map(i => {
    const s = SP[i], o = st.own[i], col = s.g ? GROUPS[s.g].color : '#5b6475';
    return `<div class="prow"><div class="sw" style="background:${col}"></div><div class="pn"><b data-act="deed" data-arg="${i}" style="cursor:pointer">${s.ico || ''} ${esc(s.name)}</b><small>${s.t === 'prop' ? LEVELS[o.lvl] : s.t === 'rail' ? 'Transport route' : 'Power source'}${o.m ? ' · ⏸️ mortgaged' : ''} · rent ${fmt(rentFor(i))}</small></div>${canAct ? actionBtns(i) : ''}</div>`;
  }).join('');
  openModal('portfolio', `<div class="mbox"><div class="mhead" style="background:linear-gradient(135deg,${p.color},#232833)"><button class="x" data-act="closeModal">✕</button><small>Collection · ${p.emoji} ${esc(p.name)}</small><h2>${fmt(p.cash)} cash · ${fmt(netWorth(p))} net worth</h2></div>
    <div class="mbody">${st.phase === 'debt' && human() === p ? `<p style="color:#ff9e80">You owe ${fmt(-p.cash)}. Sell upgrades or mortgage cards until your cash is positive.</p>` : ''}
    <p style="color:var(--muted);font-size:12.5px;margin-top:0">Own every card in a color set to complete it, then upgrade evenly: Seasoned → Rare → Epic → Legendary → Mythic.</p>
    ${rows || '<p style="color:var(--muted)">No cards yet.</p>'}</div></div>`);
}
function showTrade() {
  const p = human(); if (!p) return UI.toast('Wait for your turn to negotiate');
  if (st.phase === 'busy' || st.phase === 'debt') return;
  const opts = Object.keys(st.own).map(Number).filter(i => { const o = st.own[i]; return o.o !== p.id && !st.players[o.o].out && !(SP[i].g && groupHasBuildings(SP[i].g)); })
    .sort((a, b) => a - b).map(i => { const s = SP[i], o = st.players[st.own[i].o]; return `<option value="${i}">${o.emoji} ${esc(o.name)} — ${esc(s.name)} (${fmt(s.price)})${s.g && GIDX[s.g].filter(j => j !== i).every(j => st.own[j] && st.own[j].o === p.id) ? ' ★ completes your set' : ''}</option>`; }).join('');
  openModal('trade', `<div class="mbox"><div class="mhead" style="background:linear-gradient(135deg,#7b6cf6,#2f3f9e)"><button class="x" data-act="closeModal">✕</button><small>Dockside trading</small><h2>Make an offer</h2></div>
    <div class="mbody">${opts ? `<label style="font-size:12px;color:var(--muted)">Card</label><select id="trProp" style="width:100%;margin:4px 0 12px">${opts}</select>
      <label style="font-size:12px;color:var(--muted)">Your cash offer ($). You have ${fmt(p.cash)}</label><input id="trAmt" type="number" min="10" step="50" value="1000" style="width:100%;margin-top:4px">
      <div id="trMsg" style="margin-top:12px;font-size:13px"></div><div class="acts"><button class="btn pri" data-act="tradeSend">Send offer</button></div>
      <p style="color:var(--muted);font-size:12px">AI locals know what a card is worth to you. Finishing a set costs more.</p>` : '<p>No other player owns a tradable card yet. (Sets with upgrades can’t be traded.)</p>'}</div></div>`);
}
function showRules() {
  openModal('rules', `<div class="mbox"><div class="mhead" style="background:linear-gradient(135deg,#0f9a7f,#2f3f9e)"><button class="x" data-act="closeModal">✕</button><small>How to play</small><h2>Earn your Alaska card collection</h2></div>
    <div class="mbody rules"><ul>
      <li>Everyone starts with <b>${fmt(START)}</b>. Most valuable collection at the last ferry wins, or be the last adventurer standing.</li>
      <li>🎓 <b>Every card is a question.</b> Land on an unclaimed place and answer a real Alaska question to claim it. Right: <b>+${fmt(BONUS)}</b> local-knowledge bonus. Wrong: you still claim it, and you learn the true answer. Pass, and you still see the answer.</li>
      <li>Rank up as you learn: 🧭 <b>Sourdough</b> (3 right) → 🏔️ <b>Old Timer</b> (8 right). Everyone starts as a Cheechako (a newcomer).</li>
      <li>Eight color sets, from Dockside Ketchikan up to the Last Frontier. Own a whole set to <b>complete it</b> (rent doubles), then upgrade evenly: <b>Seasoned → Rare → Epic → Legendary → Mythic</b>.</li>
      <li>⛴️ Routes (ferry, Inside Passage, floatplane, railroad) and 💧☀️ power sources pay off when you own several.</li>
      <li>⛈️ <b>Storm Warning</b> or three doubles strands you at 🌫️ <b>Weathered In</b>. Fees and fines feed the 🔥 Salmon Bake pot, and whoever lands there eats it all.</li>
      <li>🌦️ Weather Reports and 🃏 Shore Stories mix Alaska Card legends with real Alaska history.</li>
      <li>Short on cash? <b>Mortgage</b> cards or sell upgrades. Use 🤝 Negotiate to buy from rivals.</li>
    </ul></div></div>`);
}
function showSetup() {
  const saved = loadSave();
  const rows = (UI.setup = UI.setup || DEFAULT_PLAYERS.map(p => ({ ...p })));
  openModal('setup', `<div class="mbox" style="width:min(620px,94vw)"><div class="mhead" style="background:linear-gradient(135deg,#1b4d6b,#2e9e6a 55%,#7b6cf6)">${st ? '<button class="x" data-act="closeModal">✕</button>' : ''}<small>Alaska Card · Southeast Alaska</small><h2>Ketchikan · Last Frontier Monopoly</h2><div style="font-size:13px;opacity:.9">${fmt(START)} each. Every card you claim asks a real Alaska question, and you learn the answer either way.</div></div>
    <div class="mbody">
      <div class="h"><span>Adventurers (2–4)</span><span>tap the token to change it</span></div>
      ${rows.map((p, k) => `<div class="setrow"><input type="checkbox" data-act="sOn" data-arg="${k}" ${p.on ? 'checked' : ''} ${k < 2 ? 'disabled' : ''}>
        <button class="emo" style="--pc:${PCOLORS[k]}" data-act="sEmo" data-arg="${k}">${p.emoji}</button>
        <input type="text" id="sName${k}" value="${esc(p.name)}" maxlength="24">
        <select id="sBot${k}"><option value="0" ${!p.bot && !p.remote ? 'selected' : ''}>Human (this screen)</option><option value="2" ${p.remote ? 'selected' : ''}>🌐 Remote player</option><option value="1" ${p.bot ? 'selected' : ''}>AI local</option></select></div>`).join('')}
      <div style="font-size:11.5px;color:var(--muted);margin-top:8px">🌐 Remote players join from their own device over an encrypted peer-to-peer link — you’ll get a QR code and link for each seat.</div>
      <div style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap">
        <label style="font-size:12px;color:var(--muted)">Last ferry<br><select id="sMin"><option value="15">15 min</option><option value="30" selected>30 min</option><option value="45">45 min</option><option value="60">60 min</option><option value="0">No limit</option></select></label>
        <label style="font-size:12px;color:var(--muted)">AI pace<br><select id="sSpeed"><option value="normal">Normal</option><option value="fast">Fast</option></select></label>
      </div>
      <div class="acts"><button class="btn pri" data-act="startgame">⚓ Step ashore</button>${saved ? `<button class="btn" data-act="resume">↻ Resume saved game (round ${saved.round})</button>` : ''}<button class="btn" data-act="rules">❔ Rules</button></div>
      <div class="foot">Inspired by Alaska Card: Ketchikan achievement cards · Built with HowardAI</div>
    </div></div>`, !st);
}
function readSetup() {
  UI.setup.forEach((p, k) => { p.name = $('#sName' + k).value.trim() || `Adventurer ${k + 1}`; p.bot = $('#sBot' + k).value === '1'; p.remote = $('#sBot' + k).value === '2'; });
}

// ---------- timer ----------
setInterval(() => {
  if (!st) return;
  const t = $('#timer');
  if (!st.endAt) { t.textContent = '∞'; return; }
  const rem = st.over ? 0 : Math.max(0, st.endAt - Date.now());
  t.textContent = `${String(Math.floor(rem / 60000)).padStart(2, '0')}:${String(Math.floor(rem / 1000) % 60).padStart(2, '0')}`;
  t.classList.toggle('warn', rem < 120000);
  if (!rem && !st.timeUp && !st.over && NETX.role !== 'client') { st.timeUp = true; UI.toast('🔔 Last ferry is boarding. This is the final turn'); log('🔔 Last ferry boarding: final turn'); }
}, 500);

// ---------- events ----------
const UACT = {
  view(v) { view = v; localStorage.setItem('ak-view', v); applyView(); },
  zoom(z) { zoom = z === 'reset' ? 1 : Math.min(2, Math.max(0.5, zoom * +z)); applyView(); },
  sound() { muted = !muted; localStorage.setItem('ak-muted', muted ? '1' : '0'); $('#soundBtn').textContent = muted ? '🔇' : '🔊'; },
  rules: showRules, setup: showSetup,
  deed(i) { showDeed(i); }, portfolio: showPortfolio, trade: showTrade,
  closeModal() { if (R.card || R.offer) return; UI.closeModal(); },
  invite() { NET.showInvite(); },
  takeover(k) { NET.takeover(+k); },
  copyLink(k) { NET.copyLink(+k); },
  pubUrl() { NET.setPubUrl(); },
  cardOk() { R.card && R.card(); },
  offerAns(v) { R.offer && R.offer(v === '1'); },
  sOn(k) { readSetup(); UI.setup[k].on = !UI.setup[k].on; showSetup(); },
  sEmo(k) { readSetup(); const p = UI.setup[k]; p.emoji = EMOJIS[(EMOJIS.indexOf(p.emoji) + 1) % EMOJIS.length]; showSetup(); },
  startgame() {
    readSetup();
    const cfg = { players: UI.setup.filter(p => p.on), minutes: +$('#sMin').value, speed: $('#sSpeed').value };
    if (st) { sessionStorage.setItem('ak-newcfg', JSON.stringify(cfg)); localStorage.removeItem('ak-save'); location.reload(); return; }
    launch(cfg);
  },
  resume() {
    if (st) { sessionStorage.setItem('ak-resume', '1'); location.reload(); return; }
    const s = loadSave(); if (!s) return; UI.closeModal(); resumeGame(s); boot(); log('↻ Game resumed'); NET.maybeHost(false); startTurn();
  }
};
// Remote clients forward game actions to the host instead of running the engine (ak-net.js sets NET.send).
function dispatch(a, arg) {
  if (NETX.role === 'client' && typeof NET !== 'undefined' && NET.clientAct(a, arg)) return;
  if (UACT[a]) UACT[a](arg); else if (ACT[a]) ACT[a](arg);
}
document.addEventListener('click', e => {
  if (e.target.id === 'modal' && !$('#modal').dataset.lock) return UI.closeModal();
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, arg = b.dataset.arg;
  if (b.type === 'checkbox') e.preventDefault();
  dispatch(a, arg);
});
document.addEventListener('keydown', e => {
  if (!st || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ' || e.key === 'Enter') {
    if (R.card && $('#modal').classList.contains('on') && UI.modalKind === 'card' && ($('#mcontent [data-act=cardOk]') || (cur().bot && NETX.role !== 'client'))) { e.preventDefault(); return dispatch('cardOk'); }
    if ($('#modal').classList.contains('on')) return;
    if (human() && st.phase === 'roll') { e.preventDefault(); dispatch('roll'); } else if (human() && st.phase === 'end') { e.preventDefault(); dispatch('end'); }
  }
  if (e.key === 'Escape') UACT.closeModal();
});
addEventListener('resize', () => applyView());

function boot() {
  buildBoard(); $('#tokens').innerHTML = ''; UI.tokens(); UI.render();
  $('#soundBtn').textContent = muted ? '🔇' : '🔊';
  UI.rollDice(st.dice);
}
function launch(cfg) {
  UI.closeModal(); newGame(cfg); boot();
  log(`⚓ Ship’s in: ${st.players.map(p => p.emoji + ' ' + p.name).join(', ')} each start with ${fmt(START)}`);
  UI.render(); NET.maybeHost(true); startTurn();
}
(function init() {
  NET.install();
  if (NET.joinFromHash()) return;
  buildBoard();
  const cfg = sessionStorage.getItem('ak-newcfg');
  if (cfg) { sessionStorage.removeItem('ak-newcfg'); return launch(JSON.parse(cfg)); }
  if (sessionStorage.getItem('ak-resume')) { sessionStorage.removeItem('ak-resume'); const s = loadSave(); if (s) { resumeGame(s); boot(); NET.maybeHost(false); startTurn(); return; } }
  showSetup();
})();

</script>
</body>
</html>
